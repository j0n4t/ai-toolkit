job: extension
config:
  name: sketch_v2
  process:
  - type: diffusion_trainer
    training_folder: /root/ai-toolkit/modal_output/loras
    device: cuda
    trigger_word: null
    performance_log_every: 10
    network:
      type: lora
      linear: 32
      linear_alpha: 32
      conv: 16
      conv_alpha: 16
      lokr_full_rank: true
      lokr_factor: -1
      network_kwargs:
        ignore_if_contains: []
    save:
      dtype: bf16
      save_every: 250
      max_step_saves_to_keep: 4
      save_format: diffusers
      push_to_hub: false
    datasets:
    - folder_path: /root/ai-toolkit/datasets/sketch
      caption_ext: txt
      caption_dropout_rate: 0.05
      shuffle_tokens: false
      cache_latents_to_disk: true
      resolution:
      - 512
      - 768
      - 1024
    train:
      batch_size: 1
      steps: 600
      gradient_accumulation_steps: 1
      train_unet: true
      train_text_encoder: false
      gradient_checkpointing: true
      noise_scheduler: flowmatch
      optimizer: adamw8bit
      lr: 0.0005
      timestep_type: weighted
      content_or_style: balanced
      optimizer_params:
        weight_decay: 0.0001
      unload_text_encoder: false
      cache_text_embeddings: false
      ema_config:
        use_ema: false
        ema_decay: 0.99
      skip_first_sample: false
      force_first_sample: false
      disable_sampling: false
      dtype: bf16
      diff_output_preservation: false
      diff_output_preservation_multiplier: 1
      diff_output_preservation_class: person
      switch_boundary_every: 1
      loss_type: mse
    model:
      name_or_path: Tongyi-MAI/Z-Image-Turbo
      quantize: true
      quantize_te: true
      low_vram: true
      qtype: qfloat8
      qtype_te: qfloat8
      arch: zimage:turbo
      model_kwargs: {}
      layer_offloading: false
      layer_offloading_text_encoder_percent: 1
      layer_offloading_transformer_percent: 1
      assistant_lora_path: ostris/zimage_turbo_training_adapter/zimage_turbo_training_adapter_v1.safetensors
    sample:
      sampler: flowmatch
      sample_every: 250
      width: 1024
      height: 1024
      samples:
      - prompt: woman with red hair, playing chess at the park, bomb going off in
          the background
      - prompt: a woman holding a coffee cup, in a beanie, sitting at a cafe
      - prompt: a horse is a DJ at a night club, fish eye lens, smoke machine, lazer
          lights, holding a martini
      - prompt: a man showing off his cool new t shirt at the beach, a shark is jumping
          out of the water in the background
      - prompt: a bear building a log cabin in the snow covered mountains
      - prompt: woman playing the guitar, on stage, singing a song, laser lights,
          punk rocker
      - prompt: hipster man with a beard, building a chair, in a wood shop
      - prompt: photo of a man, white background, medium shot, modeling clothing,
          studio lighting, white backdrop
      - prompt: a man holding a sign that says, 'this is a sign'
      - prompt: a bulldog, in a post apocalyptic world, with a shotgun, in a leather
          jacket, in a desert, with a motorcycle
      neg: ''
      seed: 42
      walk_seed: true
      guidance_scale: 1
      sample_steps: 8
      num_frames: 1
      fps: 1
meta:
  name: sketch_v2
  version: '1.0'